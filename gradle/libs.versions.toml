[versions]
agp = "9.3.1"
compat = "1.7.1"
constraint = "2.2.1"
core = "1.19.0"
desugar = "2.1.5"
junit = "4.13.2"
editorconfig = "0.1.0"
ideaExt = "1.4.1"
coroutines = "1.11.0"
libRecur = "0.17.1"
lifecycle = "2.11.0"
material = "1.14.0"
preference = "1.2.1"
workRuntime = "2.11.2"
androidxConcurrent = "1.3.0"
androidxTest = "1.7.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Material 3 Expressive composables (ButtonGroup, LoadingIndicator, ToggleButton, SplitButton,
# FloatingActionButtonMenu, AppBarWithSearch) only exist from 1.5.0; the stable 1.4.0 line has
# the expressive motion/shape tokens but not those components.
material3 = "1.5.0-beta01"
graphicsShapes = "1.1.0"
# Must match the Kotlin compiler that AGP 9.3.1 embeds (kotlin-compiler-embeddable 2.2.10).
kotlin = "2.2.10"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "compat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
android-tools-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
dmfs-lib-recur = { module = "org.dmfs:lib-recur", version.ref = "libRecur" }
google-android-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workRuntime" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "androidxConcurrent" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }

# Compose / Material 3 Expressive
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "ideaExt" }
ec4j-editorconfig = { id = "org.ec4j.editorconfig", version.ref = "editorconfig" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
